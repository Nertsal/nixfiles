[[language]]
name = "rust"
language-servers = [ "scls", "rust-analyzer" ]

[language-server.rust-analyzer.config]
cargo.features = "all"
check = { command = "clippy", extraArgs = "-w" }

[[language]]
name = "haskell"
auto-format = true

[[language]]
name = "gdscript"
language-servers = ["godot"]

[language-server.godot]
command = "nc"
args = ["127.0.0.1", "6005"]

