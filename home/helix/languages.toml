[[language]]
name = "roc"
scope = "source.roc"
file-types = ["roc"]
roots = []
indent = { tab-width = 4, unit = "    " }
comment-token = "#"

[[language]]
name = "scala"
auto-format = false # lags
formatter = { command = "scalafmt" , args = ["--stdin"] }

[[language]]
name = "rhai"
scope = "source.rhai"
grammar = "rust"
file-types = ["rhai"]
roots = []
indent = { tab-width = 4, unit = "    " }
comment-token = "//"

[[language]]
name = "rune"
scope = "source.rn"
grammar = "rust"
file-types = ["rn"]
roots = []
indent = { tab-width = 4, unit = "    " }
comment-token = "//"

[[grammar]]
name = "roc"
source = { git = "https://github.com/jawj/coffee-script", rev = "d06f568cd0d16e75740297068132bb9786642070", subpath = "src/grammar.coffee" }

[language-server.lean]
command = "lake"
args = ["serve"]

[[language]]
name = "lean"
language-servers = [ "scls", "lean" ]

[language-server.scls]
command = "simple-completion-language-server"

[language-server.scls.config]
feature_words = false                # enable completion by word
feature_snippets = true              # enable snippets
snippets_first = true                # completions will return before snippets by default
snippets_inline_by_word_tail = false # suggest snippets by WORD tail, for example text `xsq|` become `x^2|` when snippet `sq` has body `^2`
feature_unicode_input = true        # enable "unicode input"
feature_paths = false                # enable path completion
feature_citations = false            # enable citation completion (only on `citation` feature enabled)

# introduce a new language to enable completion on any doc by forcing set language with :set-language stub
[[language]]
name = "stub"
scope = "text.stub"
file-types = []
shebangs = []
roots = []
auto-format = false
language-servers = [ "scls" ]

[[language]]
name = "kast"
scope = "source.ks"
file-types = ["ks"]
grammar = "nim"
shebangs = []
roots = []
indent = { tab-width = 4, unit = "    " }
auto-format = true
language-servers = ["kast"]

[language-server.kast]
command = "kast"
args = ["lsp"]
