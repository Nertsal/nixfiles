preload = ~/Pictures/Wallpaper/everyone/everyone.png
#if more than one preload is desired then continue to preload other backgrounds
#preload = /path/to/next_image.png
# .. more preloads

#set the default wallpaper(s) seen on inital workspace(s)
#--depending on the number of monitors used
wallpaper {
	monitor = eDP-1
	path = ~/Pictures/Wallpaper/everyone/everyone.png
	fit_mode = cover
}
wallpaper {
	monitor = eDP-2
	path = ~/Pictures/Wallpaper/everyone/everyone.png
	fit_mode = cover
}
wallpaper {
	monitor = HDMI-A-1
	path = ~/Pictures/Wallpaper/everyone/everyone.png
	fit_mode = cover
}
wallpaper {
	monitor = HDMI-A-4
	path = ~/Pictures/Wallpaper/everyone/everyone.png
	fit_mode = cover
}

ipc = on
splash = true
